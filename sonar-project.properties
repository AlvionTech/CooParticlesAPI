# SonarQube scanner configuration for CooParticlesAPI.
#
# Usage (with a running SonarQube server):
#   1. ./gradlew :common:test :common:jacocoTestReport      # produces the JaCoCo XML below
#   2. sonar-scanner -Dsonar.host.url=<URL> -Dsonar.token=<TOKEN>
#      (or export SONAR_HOST_URL / SONAR_TOKEN)
#
# Coverage is produced by JaCoCo (the engine SonarQube reads for JVM/Kotlin).

sonar.projectKey=coostack-cooparticlesapi
sonar.projectName=CooParticlesAPI
sonar.sourceEncoding=UTF-8

sonar.sources=common/src/main/kotlin,fabric/src/main/kotlin,neoforge/src/main/kotlin
sonar.tests=common/src/test/kotlin
sonar.java.binaries=common/build/classes
sonar.java.test.binaries=common/build/classes/kotlin/test

# JaCoCo coverage report ingested by SonarQube.
sonar.coverage.jacoco.xmlReportPaths=common/build/reports/jacoco/test/jacocoTestReport.xml

# Rendering/GL- and Minecraft-runtime-bound code that cannot be unit tested without a
# live client/server is excluded from the coverage denominator to keep the metric honest.
sonar.coverage.exclusions=**/renderer/**,**/datagen/**,**/mixin/**,**/test/**
